        <main id="desen-main">
            <!-- Logo iepuraș -->
            <svg height="500" width="500">
                <!-- Față + urechi -->
                <linearGradient id="grad1">
                    <stop offset="0%" stop-color="PaleTurquoise" />
                    <stop offset="40%" stop-color="PaleGreen" />
                    <stop offset="60%" stop-color="NavajoWhite" />
                    <stop offset="100%" stop-color="PaleVioletRed" />
                </linearGradient>
                <linearGradient id="grad2">
                    <stop offset="-5%" stop-color="PaleTurquoise" />
                    <stop offset="110%" stop-color="PaleGreen" />
                </linearGradient>
                <linearGradient id="grad3">
                    <stop offset="-5%" stop-color="NavajoWhite" />
                    <stop offset="110%" stop-color="PaleVioletRed" />
                </linearGradient>
                <ellipse cx="360" cy="280" rx="30" ry="100" fill="none" style="stroke:black;stroke-width:10;" transform="rotate(10, 360, 280)"/>
                <ellipse cx="260" cy="280" rx="30" ry="100" fill="none" style="stroke:black;stroke-width:10;" transform="rotate(350, 260, 280)"/>
                <ellipse cx="310" cy="400" rx="90" ry="80" fill="none" style="stroke:black;stroke-width:8;"/>
                
                <ellipse cx="360" cy="280" rx="30" ry="100" fill="url(#grad3)" transform="rotate(10, 360, 280)"/>
                <text fill="black" font-size="25" font-family="Comic Sans MS" font-weight="bold" x="355" y="300" transform="rotate(280, 355, 300)">BAD </text>
                <text fill="black" font-size="25" font-family="Comic Sans MS" font-weight="bold" x="375" y="310" transform="rotate(280, 375, 310)"> BUNNY</text>
                <ellipse cx="260" cy="280" rx="30" ry="100" fill="url(#grad2)" transform="rotate(350, 260, 280)"/>
                <ellipse cx="310" cy="400" rx="90" ry="80" fill="url(#grad1)"></ellipse>

                <!-- Nas -->
                <path d="M 295 420 A 30 70 0 0 1 325 420" fill="black" />

                <!-- Ochi -->
                <line x1="260" y1="370" x2="260" y2="400" stroke="black" stroke-width="5" stroke-linecap="round"/>
                <line x1="246" y1="383" x2="277" y2="383" stroke="black" stroke-width="5"/>
                <line x1="360" y1="370" x2="360" y2="400" stroke="black" stroke-width="5" stroke-linecap="round"/>
                <line x1="346" y1="383" x2="377" y2="383" stroke="black" stroke-width="5"/>

                Sorry, your browser does not support inline SVG. 
            </svg>

            <!-- Logo inimă -->
            <svg height="500" width="800">
                <!-- Picioare -->
                <rect x="60" y="120" width="30" height="80" fill="black" />
                <rect x="100" y="120" width="30" height="80" fill="black" transform="rotate(350, 100, 120)"/>

                <ellipse cx="65" cy="200" rx="25" ry="18" fill="black"/>
                <ellipse cx="135" cy="200" rx="23" ry="18" fill="black"/>

                <!-- Inimă -->
                <circle cx="52" cy="50" r="50" fill="red" />
                <circle cx="148" cy="50" r="50" fill="red" />
                <polygon points="16,85 100,180 184,85 100,50" fill="red"/>


                <!-- Gură -->
                <path d="M 72 125 Q 95 100 128 125" stroke="black" stroke-width="5" fill="none" stroke-linecap="round" />
                <line x1="70" y1="120" x2="70" y2="130" stroke="black" stroke-width="5" stroke-linecap="round", transform="rotate(338, 70, 120)"/>
                <line x1="130" y1="120" x2="130" y2="130" stroke="black" stroke-width="5" stroke-linecap="round", transform="rotate(22, 130, 120)"/>

                <!-- Ochi -->
                <rect x="87" y="48" width="26" height="48" rx="12" fill="white" stroke="black" stroke-width="5" />                
                <path d="M 60 100 Q 100 70 140 100" fill="red" />
                <path d="M 80 90 Q 100 80 120 90" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
                <path d="M 100 85 Q 100 60 114 65" fill="none" stroke="black" stroke-width="6"/>
                <path d="M 100 84 Q 100 63 112 65"/>
                <polygon points="100,84 112,65 111,85"/>

                <animate id="a5" attributeName="fill" values="Plum; LightSeaGreen; Plum" dur="5s" repeatCount="indefinite"/>
                <animate id="a6" attributeName="fill" values="Plum; LightSeaGreen; Plum" dur="5s" repeatCount="indefinite"/>

                Sorry, your browser does not support inline SVG. 
            </svg>
