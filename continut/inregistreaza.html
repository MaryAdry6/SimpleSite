    <section class="inreg">
        <form id="formInregistrare" method="POST" action="/api/utilizatori">
            <fieldset class="generale">
                <legend>Informații generale:</legend>

                <label for="name"> Nume utilizator: </label>
                <input type="text" id="name" name="utilizator">

                <label for="parola"> Parolă: </label>
                <input type="password" id="parola" name="parola">

                <label for="nume"> Nume: </label>
                <input type="text" id="nume" name="Nume">

                <label for="prenume"> Prenume: </label>
                <input type="text" id="prenume" name="Prenume">

                <label for="email"> Email: </label>
                <input type="email" id="email" name="email">

                <label for="tel"> Telefon: </label>
                <input type="tel" id="tel" name="Telefon">
            </fieldset>

            <fieldset class="personale">
                <legend>Informații personale:</legend>

                <label for="sex"> Sex:</label>
                <select name="sex" id="sex">
                    <option value="Feminin">Feminin</option>
                    <option value="Masculin">Masculin</option>
                    <option value="Altul">Altul</option>
                </select>

                <label for="album"> Melodia preferată: </label>
                <input list="lista-albume" id="album" name="album" placeholder="Scrie sau alege...">
                <datalist name="lista-albume" id="lista-albume">
                    <option value="X 100pre"></option>
                    <option value="YHLQMDLG"></option>
                    <option value="El Último Tour Del Mundo"></option>
                    <option value="Nadie Sabe Lo Que Va a Pasar Mañana"></option>
                    <option value="Un Verano Sin Ti"></option>
                    <option value="Debí Tirar Más Fotos"></option>
                </datalist>

                <label for="culoare"> Culoare preferată: </label>
                <input type="color" id="culoare" name="culoare">

                <label for="data"> Dată naștere: </label>
                <input type="date" id="data" name="data">

                <label for="ora"> La ce oră ascultați cel mai des discografia lui Bad Bunny?</label>
                <input type="time" id="ora" name="ora">

                <label for="like"> Cât de mult vă place muzica lui Bad Bunny?</label>
                <input type="range" id="like" name="like" min="1" max="7" step="1">

                <label for="url"> Site personal: </label>
                <input type="url" id="url" name="url">

                <label for="song"> Care este motivul pentru vă place Bad Bunny?</label>
                <textarea id="song" name="song" rows="1" cols="25">Pentru că ...</textarea>
            </fieldset>

            <div class="inreg-butoane">
                <input type="submit" value="Înregistrează">
                <button type="reset">Resetează</button>
            </div>
        </form>
    </section>
