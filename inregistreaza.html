<!DOCTYPE html>
<html lang = "ro">

    <head>
        <meta charset="UTF-8">
        <title>Înregistrează-te</title>

        <link rel="icon" type="image/png"
            href="imagini/icon.png"/>
        <link rel="stylesheet" type="text/css"
            href="css/stil.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    </head>

    <body>
        <header>
            <h1>Bad Bunny</h1>
            <hr>
            <nav>
                <h2>
                    <a href="index.html">Acasă</a>
                    <a href="despre.html">Despre</a>
                    <a href="video.html">Video</a>
                    <a href="desen.html">Desen</a>
                    <a href="invat.html">Învață</a>
                    <a href="inregistreaza.html">Înregistrează-te </a>
                </h2>
            </nav>
        </header>

        <main id="inreg-main">
            <div class="img-stanga">
                <img src="imagini/album1.png" alt="Cover Album X 100pre">
                <img src="imagini/album2.png" alt="Cover Album YHLQMDLG">
                <img src="imagini/album3.png" alt="Cover Album El Último Tour Del Mundo">
                <img src="imagini/album4.png" alt="Cover Album Nadie Sabe Lo Que Va a Pasar Mañana">
                <img src="imagini/album5.png" alt="Cover Album Un Verano Sin Ti">
                <img src="imagini/album6.png" alt="Cover Album Debí Tirar Más Fotos">

                <img src="imagini/album1.png" alt="Cover Album X 100pre">
                <img src="imagini/album2.png" alt="Cover Album YHLQMDLG">
                <img src="imagini/album3.png" alt="Cover Album El Último Tour Del Mundo">
                <img src="imagini/album4.png" alt="Cover Album Nadie Sabe Lo Que Va a Pasar Mañana">
                <img src="imagini/album5.png" alt="Cover Album Un Verano Sin Ti">
                <img src="imagini/album6.png" alt="Cover Album Debí Tirar Más Fotos">
            </div>

            <section class="inreg">
                <form>
                    <fieldset class="generale">
                        <legend>Informații generale:</legend>

                        <label for="name"> Nume utilizator: </label>
                        <input type="text" id="name" name="NumeUtil">

                        <label for="parola"> Parolă: </label>
                        <input type="password" id="parola" name="Parola">

                        <label for="nume"> Nume: </label>
                        <input type="text" id="nume" name="Nume">

                        <label for="prenume"> Prenume: </label>
                        <input type="text" id="prenume" name="Prenume">

                        <label for="email"> Email: </label>
                        <input type="email" id="email" name="email">

                        <label for="tel"> Telefon: </label>
                        <input type="tel" id="tel" name="Telefon">
                    </fieldset>

                    <fieldset class="personale">
                        <legend>Informații personale:</legend>

                        <label for="sex"> Sex:</label>
                        <select name="sex" id="sex">
                            <option value="Feminin">Feminin</option>
                            <option value="Masculin">Masculin</option>
                            <option value="Altul">Altul</option>
                        </select>

                        <label for="album"> Melodia preferată: </label>
                        <input list="album" id="album" name="album" placeholder="Scrie sau alege...">
                        <datalist name="album" id="album">
                            <option value="X 100pre"></option>
                            <option value="YHLQMDLG"></option>
                            <option value="El Último Tour Del Mundo"></option>
                            <option value="Nadie Sabe Lo Que Va a Pasar Mañana"></option>
                            <option value="Un Verano Sin Ti"></option>
                            <option value="Debí Tirar Más Fotos"></option>
                        </datalist>

                        <label for="culoare"> Culoare preferată: </label>
                        <input type="color" id="culoare" name="culoare">

                        <label for="data"> Dată naștere: </label>
                        <input type="date" id="data" name="data">

                        <label for="ora"> La ce oră ascultați cel mai des discografia lui Bad Bunny?</label>
                        <input type="time" id="ora" name="ora">

                        <label for="like"> Cât de mult vă place muzica lui Bad Bunny?</label>
                        <input type="range" id="like" name="like" min="1" max="7" step="1">

                        <label for="url"> Site personal: </label>
                        <input type="url" id="url" name="url">

                        <label for="song"> Care este motivul pentru vă place Bad Bunny?</label>
                        <textarea id="song" name="song" rows="1" cols="25">Pentru că ...</textarea>
                    </fieldset>

                    <div class="inreg-butoane">
                        <button type="submit" disabled>Înregistrează</button>
                        <button type="reset">Resetează</button>
                    </div>
                </form>
            </section>

            <div class="img-dreapta">
                <img src="imagini/album1.png" alt="Cover Album X 100pre">
                <img src="imagini/album2.png" alt="Cover Album YHLQMDLG">
                <img src="imagini/album3.png" alt="Cover Album El Último Tour Del Mundo">
                <img src="imagini/album4.png" alt="Cover Album Nadie Sabe Lo Que Va a Pasar Mañana">
                <img src="imagini/album5.png" alt="Cover Album Un Verano Sin Ti">
                <img src="imagini/album6.png" alt="Cover Album Debí Tirar Más Fotos">

                <img src="imagini/album1.png" alt="Cover Album X 100pre">
                <img src="imagini/album2.png" alt="Cover Album YHLQMDLG">
                <img src="imagini/album3.png" alt="Cover Album El Último Tour Del Mundo">
                <img src="imagini/album4.png" alt="Cover Album Nadie Sabe Lo Que Va a Pasar Mañana">
                <img src="imagini/album5.png" alt="Cover Album Un Verano Sin Ti">
                <img src="imagini/album6.png" alt="Cover Album Debí Tirar Más Fotos">
            </div>
        </main>

        <footer>
            <hr>
            <span>&nbsp;&copy;</span> <i>2026</i> Proiect 1 - Ciurilă Maria-Adriana
        </footer>
    </body>

</html>
