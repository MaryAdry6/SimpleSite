<!DOCTYPE html>
<html lang = "ro">

    <head>
        <meta charset="UTF-8">
        <title>Înregistrează-te</title>

        <link rel="icon" type="image/png"
            href="imagini/icon.png"/>
        <link rel="stylesheet" type="text/css"
            href="css/stil.css" />
    </head>

    <body>
        <header>
            <h1>Bad Bunny</h1>

            <nav>
                <h2>
                    <a href="index.html">Acasă</a>
                    <a href="despre.html">Despre</a>
                    <a href="video.html">Video</a>
                    <a href="desen.html">Desen</a>
                    <a href="inregistreaza.html">Înregistrează-te </a>
                </h2>
            </nav>
        </header>

        <main>
            <section>
                <br>
                <h3>Informații generale:</h3>
                <form>
                    <label for="name"> Nume utilizator: </label>
                    <input type="text" id="name" name="NumeUtil">
                    <br>

                    <label for="parola"> Parolă: </label>
                    <input type="password" id="parola" name="Parola">
                    <br>

                    <label for="nume"> Nume: </label>
                    <input type="text" id="nume" name="Nume">
                    <br>

                    <label for="prenume"> Prenume: </label>
                    <input type="text" id="prenume" name="Prenume">
                    <br>

                    <label for="email"> Email: </label>
                    <input type="email" id="email" name="email">
                    <br>

                    <label for="tel"> Telefon: </label>
                    <input type="tel" id="tel" name="Telefon">
                    <br><br>
                </form>
            </section>
            
            <section>
                <br>
                <h3>Informații personale:</h3>
                <form>
                    <label for="sex"> Sex:</label>
                    <select name="sex" id="sex">
                        <option value="Feminin">Feminin</option>
                        <option value="Masculin">Masculin</option>
                        <option value="Altul">Altul</option>
                    </select>
                    <br>

                    <label for="album"> Album preferat: </label>
                    <select name="album" id="album">
                        <option value="X 100pre">X 100pre</option>
                        <option value="YHLQMDLG">YHLQMDLG</option>
                        <option value="El Último Tour Del Mundo">El Último Tour Del Mundo</option>
                        <option value="Un Verano Sin Ti">Un Verano Sin Ti</option>
                        <option value="Debí Tirar Más Fotos">Debí Tirar Más Fotos</option>
                    </select>
                    <!-- <datalist name="album" id="album">
                        <option value="X 100pre">
                        <option value="YHLQMDLG">
                        <option value="El Último Tour Del Mundo">
                        <option value="Un Verano Sin Ti">
                        <option value="Debí Tirar Más Fotos">
                    </datalist> -->
                    <br>

                    <label for="culoare"> Culoare preferată: </label>
                    <input type="color" id="culoare" name="culoare">
                    <br>

                    <label for="data"> Dată naștere: </label>
                    <input type="date" id="data" name="data">
                    <br>

                    <label for="ora"> La ce oră ascultați cel mai des discografia lui Bad Bunny? &nbsp;</label>
                    <input type="time" id="ora" name="ora">
                    <br>

                    <label for="like"> Cât de mult vă place muzica lui Bad Bunny? &nbsp;</label>
                    <input type="range" id="like" name="like">
                    <br>

                    <label for="url"> Site personal: </label>
                    <input type="url" id="url" name="url">
                    <br>

                    <label for="song"> Care este cântecul dumneavoastră preferat? &nbsp;</label>
                    <textarea id="song" name="song" rows="1" cols="25">Ex.: CAFé CON RON</textarea>
                    <br><br>

                    <button type="inreg" disabled>Înregistrează</button>
                    <button type="reset">Resetează</button>
                </form>
            </section>
            <br><br>
        </main>

    <footer>
        <hr>
        &copy; <i>2026</i> Proiect 1 - Ciurilă Maria-Adriana
    </footer>
</body>
